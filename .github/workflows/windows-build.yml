name: Build Windows application

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the ledger and desktop application
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          result = subprocess.run(
              [sys.executable, "-m", "unittest", "discover", "-s", "tests", "-v"],
              capture_output=True, text=True, encoding="utf-8", errors="replace",
          )
          report = result.stdout + result.stderr
          print(report, end="")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("### Receipt Recorder tests\n\n```text\n" + report + "\n```\n")
          sys.exit(result.returncode)
      - name: Install Windows packaging tools
        run: python -m pip install -r requirements-build.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ReceiptRecorder app.py
      - uses: actions/upload-artifact@v4
        with:
          name: ReceiptRecorder-Windows
          path: dist/ReceiptRecorder.exe
          if-no-files-found: error
